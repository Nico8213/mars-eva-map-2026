<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Library: Three.js | Version: r128 (Stable release from 2021) -->
    <meta charset="UTF-8">
    <title>Mars EVA - Video Intro</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #watermark { 
            position: absolute; 
            bottom: 12px; 
            left: 12px; 
            color: rgba(255, 255, 255, 0.6); 
            font-size: 12px; 
            pointer-events: none;
        }
        #warning { 
            position: absolute; 
            top: 12px; 
            left: 12px; 
            color: #ff5555; 
            background: rgba(0,0,0,0.8);
            padding: 5px;
            display: none; 
            font-size: 14px; 
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="watermark">Illustration - not project data</div>
    <div id="warning">Warning: Local 'mars_texture.jpg' not found. Using solid color fallback.</div>

    <script>
        // 1. Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3.5;
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        scene.add(new THREE.AmbientLight(0x222222));
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 3, 5);
        scene.add(light);

        // 3. Mars Globe
        const radius = 1;
        const geometry = new THREE.SphereGeometry(radius, 64, 64);
        const material = new THREE.MeshPhongMaterial({ color: 0xcc5533 }); // Fallback color
        const mars = new THREE.Mesh(geometry, material);
        scene.add(mars);

        // Load Texture with Fallback
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load(
            'mars_texture.jpg', 
            function(texture) {
                material.map = texture;
                material.color.setHex(0xffffff); // Clear fallback color
                material.needsUpdate = true;
            }, 
            undefined, 
            function(err) {
                document.getElementById('warning').style.display = 'block';
            }
        );

        // 4. Jezero Crater POI Marker (Lat: 18.44° N, Lon: 77.45° E)
        const markerGeo = new THREE.SphereGeometry(0.015, 16, 16);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const marker = new THREE.Mesh(markerGeo, markerMat);

        // Convert Geo-coordinates to 3D Cartesian
        const lat = 18.44;
        const lon = 77.45;
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lon + 90) * (Math.PI / 180); // +90 aligns standard equirectangular textures
        
        marker.position.setFromSphericalCoords(radius, phi, theta);
        mars.add(marker); // Attach to globe so it rotates together

        // 5. Animation (Rotate for 3s, then Zoom)
        const startTime = Date.now();
        
        function animate() {
            requestAnimationFrame(animate);
            const elapsed = Date.now() - startTime;

            if (elapsed < 3000) {
                // Phase 1: Slow Rotation
                mars.rotation.y += 0.003;
            } else {
                // Phase 2: Zoom to Jezero Crater
                const markerWorldPos = new THREE.Vector3();
                marker.getWorldPosition(markerWorldPos);
                
                // Target camera position: 2.2 units away from center to preserve planet curvature
                const targetCamPos = markerWorldPos.clone().normalize().multiplyScalar(2.2);
                
                // Smooth interpolation (Lerp) slowed down for a smoother approach
                camera.position.lerp(targetCamPos, 0.03);
                camera.lookAt(markerWorldPos);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Handle Window Resize
        window.addEventListener('resize', function() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
